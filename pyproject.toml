[tool.poetry]
name = "pywebidl2"
version = "0.1.8"
description = "WebIDL tool"
authors = ["Sergey Reshetnikov <resh.sersh@gmail.com>"]
license = "MIT"

readme = "README.md"
repository = "https://github.com/PrVrSs/pywebidl2"
homepage = "https://github.com/PrVrSs/pywebidl2"

keywords = [
  "WebIDL",
  "parser",
  "ast"
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"

antlr4-python3-runtime = "4.13.2"
click = "^8.3.1"
more-itertools = "^10.8.0"
stringcase = "^1.2.0"

[tool.poetry.group.dev.dependencies]
mypy = ">=1.19.1,<3.0.0"
pylint = "^4.0.5"
pytest = "^9.0.2"
pytest-cov = "^7.0.0"
isort = "^8.0.1"

[build-system]
requires = ["poetry>=0.12"]
build-backend = "poetry.masonry.api"
